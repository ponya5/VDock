<svg xmlns="http://www.w3.org/2000/svg" width="960" height="280" viewBox="0 0 960 280" role="img" aria-label="VDock banner">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="45%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#312e81"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="960" height="280" rx="24" fill="url(#bg)"/>
  <circle cx="820" cy="60" r="90" fill="#6366f1" opacity="0.18"/>
  <circle cx="120" cy="220" r="70" fill="#22d3ee" opacity="0.12"/>
  <g filter="url(#glow)">
    <rect x="72" y="78" width="56" height="56" rx="14" fill="url(#accent)" opacity="0.95"/>
    <rect x="136" y="78" width="56" height="56" rx="14" fill="#334155" opacity="0.95"/>
    <rect x="200" y="78" width="56" height="56" rx="14" fill="#334155" opacity="0.95"/>
    <rect x="72" y="142" width="56" height="56" rx="14" fill="#334155" opacity="0.95"/>
    <rect x="136" y="142" width="56" height="56" rx="14" fill="url(#accent)" opacity="0.95"/>
    <rect x="200" y="142" width="56" height="56" rx="14" fill="#334155" opacity="0.95"/>
  </g>
  <text x="300" y="118" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="54" font-weight="700">VDock</text>
  <text x="302" y="158" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="24">Virtual Stream Deck for your desktop</text>
  <text x="302" y="198" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="18">Buttons " Scenes " System control " Live widgets " Animated backgrounds</text>
</svg>
